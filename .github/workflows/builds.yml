name: Build GDExtension
on:
  workflow_dispatch:
    inputs:
      target-type:
        description: "Choose build type"
        required: true
        default: "template_debug"
        type: choice
        options:
          - template_debug
          - template_release
      float-precision:
        description: "Choose float precision"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - double

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # build for every platform/arch combination, but target-type and precision come from the workflow dispatch inputs
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: linux, arch: x86_32, os: ubuntu-22.04 },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm },
            { platform: linux, arch: arm32, os: ubuntu-22.04-arm },
            { platform: windows, arch: x86_64, os: windows-latest },
            { platform: windows, arch: x86_32, os: windows-latest },
            { platform: windows, arch: arm64, os: windows-latest },
            { platform: macos, arch: universal, os: macos-latest },
            { platform: android, arch: x86_64, os: ubuntu-22.04 },
            { platform: android, arch: x86_32, os: ubuntu-22.04 },
            { platform: android, arch: arm64, os: ubuntu-22.04 },
            { platform: android, arch: arm32, os: ubuntu-22.04 },
            { platform: ios, arch: arm64, os: macos-latest },
            { platform: web, arch: wasm32, os: ubuntu-22.04 },
          ]
        target-type: ["${{ github.event.inputs['target-type'] }}"]
        float-precision: ["${{ github.event.inputs['float-precision'] }}"]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force -ErrorAction SilentlyContinue

      # Prepare artifact directory containing the entire demo/addons directory (excluding *.iud)
      - name: Prepare artifact contents (Linux / macOS)
        if: ${{ matrix.target.platform != 'windows' }}
        shell: bash
        run: |
          ART="$GITHUB_WORKSPACE/artifact"
          rm -rf "$ART"
          mkdir -p "$ART"
          if [ -d "$GITHUB_WORKSPACE/demo/addons" ]; then
            rsync -a --prune-empty-dirs --exclude='*.iud' "$GITHUB_WORKSPACE/demo/addons/" "$ART/addons/"
          fi
          
          if [ -d "$GITHUB_WORKSPACE/demo/bin" ]; then
            mkdir -p "$ART/addons/bin"
            rsync -a "$GITHUB_WORKSPACE/demo/bin/" "$ART/addons/bin/"
          fi

      - name: Prepare artifact contents (Windows)
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          $art = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $art
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE 'demo\addons'
          $dst = Join-Path $art 'addons'
          if (Test-Path $src) {
            # robocopy copies and can exclude files by pattern
            robocopy $src $dst /E /XF *.iud | Out-Null
          }
          $binSrc = Join-Path $env:GITHUB_WORKSPACE 'demo\bin'
          $binDst = Join-Path $dst 'bin'
          if (Test-Path $binSrc) {
            New-Item -ItemType Directory -Force -Path $binDst | Out-Null
            robocopy $binSrc $binDst /E | Out-Null
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-cpp-template-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/artifact/**

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: godot-cpp-template
          pattern: godot-cpp-template-*
          delete-merged: true
